<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мини-образовательный сайт</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 480px;
    }
    h1 {
      color: #1a73e8;
      margin-bottom: 15px;
    }
    p {
      color: #5f6368;
      font-size: 18px;
      line-height: 1.5;
    }
    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 16px;
      background-color: #e6f4ea;
      color: #137333;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Мини-образовательный сайт</h1>
    <p>Привет, студенты!</p>
    <div class="status">CI/CD Pipeline: GitHub Actions + Pages</div>
  </div>
</body>
</html>
